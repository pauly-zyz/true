services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-true_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-truebot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - true_pg:/var/lib/postgresql/data
volumes:
  true_pg:
